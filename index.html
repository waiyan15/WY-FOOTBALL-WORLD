<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WY Live Football Hub</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0b0f19; color: #e6edf3; padding-bottom: 30px; }
    
    .navbar {
      background: #111827;
      border-bottom: 1px solid #1f2937;
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 18px; color: #38bdf8; }
    .status-badge { background: rgba(16, 185, 129, 0.15); color: #10b981; border: 1px solid #10b981; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: bold; }

    .container { max-width: 720px; margin: 16px auto; padding: 0 14px; }

    /* League Selector */
    .league-bar { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 14px; }
    .league-btn { background: #161f30; color: #94a3b8; border: 1px solid #1f293d; padding: 8px 16px; border-radius: 20px; font-size: 12.5px; cursor: pointer; white-space: nowrap; transition: 0.2s; }
    .league-btn.active { background: #0284c7; color: #fff; border-color: #0284c7; font-weight: bold; }

    /* Action bar */
    .action-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .table-title { font-size: 14px; font-weight: bold; color: #cbd5e1; display: flex; align-items: center; gap: 8px; }
    .btn-refresh { background: #1e293b; border: 1px solid #334155; color: #38bdf8; padding: 6px 12px; border-radius: 8px; font-size: 12px; cursor: pointer; display: flex; align-items: center; gap: 6px; }

    /* Table */
    .table-box { background: #111827; border: 1px solid #1f2937; border-radius: 14px; overflow-x: auto; padding: 6px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    table { width: 100%; border-collapse: collapse; font-size: 12.5px; text-align: center; }
    th { color: #64748b; font-size: 11px; padding: 10px 4px; border-bottom: 1px solid #1f2937; }
    td { padding: 10px 4px; border-bottom: 1px solid #141d2e; }
    td.team-name { text-align: left; font-weight: 600; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
    .team-badge-img { width: 22px; height: 22px; object-fit: contain; }

    .loading-spinner { text-align: center; padding: 40px; color: #94a3b8; font-size: 13px; }
  </style>
</head>
<body>

  <div class="navbar">
    <div class="brand">
      <i class="fa-solid fa-futbol"></i>
      <span>WY FOOTBALL HUB</span>
    </div>
    <div class="status-badge"><i class="fa-solid fa-bolt"></i> Live Data</div>
  </div>

  <div class="container">
    <!-- League Switcher Buttons -->
    <div class="league-bar">
      <button class="league-btn active" onclick="changeLeague('4328', this)">Premier League</button>
      <button class="league-btn" onclick="changeLeague('4335', this)">La Liga</button>
      <button class="league-btn" onclick="changeLeague('4332', this)">Serie A</button>
      <button class="league-btn" onclick="changeLeague('4331', this)">Bundesliga</button>
      <button class="league-btn" onclick="changeLeague('4334', this)">Ligue 1</button>
    </div>

    <div class="action-row">
      <div class="table-title" id="currentLeagueName">
        <i class="fa-solid fa-trophy" style="color: #f59e0b;"></i> အမှတ်ပေးဇယား အဆင့်များ
      </div>
      <button class="btn-refresh" onclick="loadStandings()">
        <i class="fa-solid fa-arrows-rotate"></i> Refresh
      </button>
    </div>

    <!-- Live Standings Table Container -->
    <div class="table-box">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th style="text-align: left;">အသင်း</th>
            <th>ပွဲ</th>
            <th>နိုင်</th>
            <th>သရေ</th>
            <th>ရှုံး</th>
            <th>ဂိုးကွာ</th>
            <th>ရမှတ်</th>
          </tr>
        </thead>
        <tbody id="standingsTableBody">
          <tr><td colspan="8" class="loading-spinner"><i class="fa-solid fa-spinner fa-spin"></i> အမှတ်ပေးဇယားကို ဆွဲယူနေပါသည်...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    let currentLeagueId = '4328'; // Default: English Premier League

    window.onload = function() {
      loadStandings();
    };

    function changeLeague(id, el) {
      currentLeagueId = id;
      document.querySelectorAll('.league-btn').forEach(btn => btn.classList.remove('active'));
      el.classList.add('active');
      loadStandings();
    }

    async function loadStandings() {
      const tbody = document.getElementById('standingsTableBody');
      tbody.innerHTML = `<tr><td colspan="8" class="loading-spinner"><i class="fa-solid fa-spinner fa-spin"></i> တကယ့် Live ဒေတာများကို ဆွဲယူနေပါသည်...</td></tr>`;

      try {
        // Open API with no CORS restriction and no private token needed
        const url = `https://www.thesportsdb.com/api/v1/json/3/lookuptable.php?l=${currentLeagueId}&s=2024-2025`;
        const res = await fetch(url);
        const data = await res.json();

        if (data && data.table && data.table.length > 0) {
          renderTable(data.table);
        } else {
          // Fallback to recent season if current is updating
          const fallbackRes = await fetch(`https://www.thesportsdb.com/api/v1/json/3/lookuptable.php?l=${currentLeagueId}&s=2023-2024`);
          const fallbackData = await fallbackRes.json();
          renderTable(fallbackData.table || []);
        }
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="8" style="padding:24px; color:#f87171;">ဒေတာဆွဲယူ၍ မရသေးပါ။ အင်တာနက်ချိတ်ဆက်မှုကို စစ်ဆေးပြီး Refresh ပြန်နှိပ်ပေးပါ။</td></tr>`;
      }
    }

    function renderTable(table) {
      const tbody = document.getElementById('standingsTableBody');
      if (!table.length) {
        tbody.innerHTML = `<tr><td colspan="8" style="padding:20px; color:#64748b;">ဇယားဒေတာ မရှိသေးပါ။</td></tr>`;
        return;
      }

      let rowsHtml = '';
      table.forEach(team => {
        const rank = parseInt(team.intRank);
        let rankColor = '#94a3b8';
        if (rank <= 4) rankColor = '#10b981'; // Champions League spots
        else if (rank === 5) rankColor = '#38bdf8'; // Europa League

        rowsHtml += `
          <tr>
            <td style="font-weight: bold; color: ${rankColor};">${team.intRank}</td>
            <td class="team-name">
              <img src="${team.strBadge || ''}" class="team-badge-img" onerror="this.style.display='none'">
              <span>${team.strTeam}</span>
            </td>
            <td>${team.intPlayed}</td>
            <td>${team.intWin}</td>
            <td>${team.intDraw}</td>
            <td>${team.intLoss}</td>
            <td>${team.intGoalDifference}</td>
            <td style="font-weight: bold; color: #38bdf8; font-size: 13.5px;">${team.intPoints}</td>
          </tr>
        `;
      });

      tbody.innerHTML = rowsHtml;
    }
  </script>
</body>
</html>
