<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WY Live Football Hub</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #0b0f19;
      color: #e6edf3;
      padding-bottom: 40px;
    }

    /* Navbar */
    .navbar {
      background: #111827;
      border-bottom: 1px solid #1f2937;
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 18px;
      color: #38bdf8;
    }

    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(239, 68, 68, 0.15);
      color: #ef4444;
      border: 1px solid #ef4444;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: bold;
    }

    .live-dot {
      width: 7px;
      height: 7px;
      background: #ef4444;
      border-radius: 50%;
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.8); }
      100% { opacity: 1; transform: scale(1); }
    }

    .container {
      max-width: 800px;
      margin: 16px auto;
      padding: 0 14px;
    }

    .tab-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }

    .tab-btn {
      flex: 1;
      background: #161f30;
      color: #94a3b8;
      border: 1px solid #1f293d;
      padding: 10px;
      border-radius: 12px;
      font-size: 13px;
      cursor: pointer;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: 0.2s;
    }

    .tab-btn.active {
      background: #0284c7;
      color: #ffffff;
      border-color: #0284c7;
    }

    /* Live Stream & Widget Box */
    .widget-card {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      min-height: 650px;
    }

    iframe {
      width: 100%;
      height: 750px;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <!-- Top Navbar -->
  <div class="navbar">
    <div class="brand">
      <i class="fa-solid fa-futbol"></i>
      <span>WY FOOTBALL LIVE</span>
    </div>
    <div class="live-badge">
      <span class="live-dot"></span> တိုက်ရိုက် LIVE
    </div>
  </div>

  <div class="container">
    <!-- Tab Controls -->
    <div class="tab-bar">
      <button class="tab-btn active" onclick="switchWidget('livescore', this)">
        <i class="fa-solid fa-bolt"></i> Real-time Live Scores
      </button>
      <button class="tab-btn" onclick="switchWidget('highlights', this)">
        <i class="fa-solid fa-play"></i> Video Highlights
      </button>
    </div>

    <!-- Live Widget Frame -->
    <div class="widget-card">
      <iframe 
        id="footballFrame"
        src="https://www.scorebat.com/embed/livescore/" 
        allow="autoplay; fullscreen"
        loading="lazy">
      </iframe>
    </div>
  </div>

  <script>
    function switchWidget(type, btn) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      const frame = document.getElementById('footballFrame');
      if (type === 'livescore') {
        frame.src = "https://www.scorebat.com/embed/livescore/";
      } else {
        frame.src = "https://www.scorebat.com/embed/";
      }
    }
  </script>
</body>
</html>
